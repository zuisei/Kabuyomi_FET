name = "md-admin-testflight"
main = "src/admin.ts"
compatibility_date = "2026-07-21"
workers_dev = true

[vars]
ENVIRONMENT = "testflight"
WHITE_HOUSE_MODIFIED_AT_OVERRIDES = '{"https://www.whitehouse.gov/?p=45342":"2026-07-20T19:40:19.000Z"}'
OPENAI_TRANSLATION_MODEL = "gpt-5-nano-2025-08-07"
TRANSLATION_REALTIME_CUTOFF = "2026-07-21T15:00:00.000Z"
TRANSLATION_REALTIME_LIMIT = "5"
TRANSLATION_DAILY_TOKEN_BUDGET = "1900000"

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "CORE"
database_name = "market-docket-core-testflight"
database_id = "7c5551d7-6aa8-45ac-a09c-bb53802c9fe9"
migrations_dir = "migrations/core"

[[d1_databases]]
binding = "OPS"
database_name = "market-docket-ops-testflight"
database_id = "1b011ef4-37b6-4049-9c45-8b4d0e05ed2e"
migrations_dir = "migrations/ops"

[[r2_buckets]]
binding = "RAW"
bucket_name = "market-docket-raw-testflight"

[[r2_buckets]]
binding = "DERIVED"
bucket_name = "market-docket-derived-testflight"

[[r2_buckets]]
binding = "TEMP"
bucket_name = "market-docket-temp-testflight"

[observability]
enabled = true
