name = "md-api-prod"
main = "src/index.ts"
compatibility_date = "2026-07-21"
workers_dev = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[[ratelimits]]
name = "PUBLIC_RATE_LIMITER"
namespace_id = "43002"

  [ratelimits.simple]
  limit = 300
  period = 60

[[ratelimits]]
name = "TRANSLATION_REQUEST_RATE_LIMITER"
namespace_id = "43012"

  [ratelimits.simple]
  limit = 5
  period = 60

[vars]
ENVIRONMENT = "production"
TRANSLATION_REALTIME_CUTOFF = "2026-07-21T15:00:00.000Z"

[[services]]
binding = "TRANSLATION_ADMIN"
service = "md-admin-prod"

[[d1_databases]]
binding = "CORE"
database_name = "market-docket-core-prod"
database_id = "1622c15a-5301-4edc-a749-ef078bba67b1"
migrations_dir = "migrations/core"

[[d1_databases]]
binding = "OPS"
database_name = "market-docket-ops-prod"
database_id = "93bf5ee8-ff4e-446e-b2f7-93c3bcd85fd1"
migrations_dir = "migrations/ops"

[[r2_buckets]]
binding = "RAW"
bucket_name = "market-docket-raw-prod"

[[r2_buckets]]
binding = "DERIVED"
bucket_name = "market-docket-derived-prod"

[[r2_buckets]]
binding = "TEMP"
bucket_name = "market-docket-temp-prod"

[observability]
enabled = true
