name: Kabuyomi
options:
  minimumXcodeGenVersion: 2.45.0
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    PRODUCT_BUNDLE_IDENTIFIER: app.kabuyomi.ios
    CURRENT_PROJECT_VERSION: 6
    MARKETING_VERSION: 1.0.2
    DEVELOPMENT_TEAM: UGCJZH9KG4
    GENERATE_INFOPLIST_FILE: YES
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CODE_SIGN_STYLE: Automatic
    ENABLE_CODE_COVERAGE: NO
    CLANG_COVERAGE_MAPPING: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    version: 13.2.0
schemes:
  Kabuyomi:
    build:
      targets:
        Kabuyomi: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: KabuyomiTests
          parallelizable: true
          randomExecutionOrder: true
    analyze:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
      revealArchiveInOrganizer: false
targets:
  Kabuyomi:
    type: application
    platform: iOS
    sources:
      - path: Kabuyomi
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
    info:
      path: Kabuyomi/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Kabuyomi
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UIApplicationSupportsIndirectInputEvents: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        ITSAppUsesNonExemptEncryption: false
        KABUYOMI_API_BASE_URL: $(KABUYOMI_API_BASE_URL)
        LSApplicationCategoryType: public.app-category.finance
        GADApplicationIdentifier: ca-app-pub-1248492954379402~7909080109
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Kabuyomi/Kabuyomi.entitlements
        PRODUCT_NAME: Kabuyomi
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          APP_ATTEST_ENVIRONMENT: development
          KABUYOMI_API_BASE_URL: https://kabuyomi-api-test.dznqjmctk7.workers.dev
        Release:
          APP_ATTEST_ENVIRONMENT: production
          KABUYOMI_API_BASE_URL: https://kabuyomi-api.dznqjmctk7.workers.dev
    postBuildScripts:
      - name: Generate Ad SDK dSYMs for Archive
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail

          # Google distributes these SDKs as stripped binary frameworks through SPM.
          # App Store symbol upload expects matching dSYM bundles in the archive.
          if [ "${PLATFORM_NAME:-}" != "iphoneos" ]; then
            exit 0
          fi

          if [ "${ACTION:-}" != "install" ] && [ -z "${ARCHIVE_PRODUCTS_PATH:-}" ]; then
            exit 0
          fi

          frameworks_dir="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          dsym_dir="${DWARF_DSYM_FOLDER_PATH}"
          mkdir -p "${dsym_dir}"

          for framework in GoogleMobileAds UserMessagingPlatform; do
            binary="${frameworks_dir}/${framework}.framework/${framework}"
            output="${dsym_dir}/${framework}.framework.dSYM"

            if [ ! -x "${binary}" ] || [ -d "${output}" ]; then
              continue
            fi

            echo "Generating archive dSYM for ${framework}.framework"
            dsymutil "${binary}" -o "${output}"
          done
  KabuyomiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KabuyomiTests
    dependencies:
      - target: Kabuyomi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.kabuyomi.ios.tests
        PRODUCT_NAME: KabuyomiTests
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kabuyomi.app/Kabuyomi"
        BUNDLE_LOADER: "$(TEST_HOST)"
