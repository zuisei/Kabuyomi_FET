name: Kabuyomi
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    PRODUCT_BUNDLE_IDENTIFIER: app.kabuyomi.ios
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    GENERATE_INFOPLIST_FILE: YES
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_ASSET_PATHS: "\"Kabuyomi/Resources\""
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Kabuyomi:
    type: application
    platform: iOS
    sources:
      - path: Kabuyomi
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Kabuyomi
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        PRODUCT_NAME: Kabuyomi
        TARGETED_DEVICE_FAMILY: "1"
