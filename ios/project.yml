name: Kabuyomi
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    PRODUCT_BUNDLE_IDENTIFIER: app.kabuyomi.ios
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 0.1.0
    DEVELOPMENT_TEAM: 99VXX64UU2
    GENERATE_INFOPLIST_FILE: YES
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CODE_SIGN_STYLE: Automatic
    ENABLE_CODE_COVERAGE: NO
    CLANG_COVERAGE_MAPPING: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  Kabuyomi:
    build:
      targets:
        Kabuyomi: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: KabuyomiTests
          parallelizable: true
          randomExecutionOrder: true
    analyze:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
      revealArchiveInOrganizer: false
targets:
  Kabuyomi:
    type: application
    platform: iOS
    sources:
      - path: Kabuyomi
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Kabuyomi
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        PRODUCT_NAME: Kabuyomi
        TARGETED_DEVICE_FAMILY: "1"
  KabuyomiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KabuyomiTests
    dependencies:
      - target: Kabuyomi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.kabuyomi.ios.tests
        PRODUCT_NAME: KabuyomiTests
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kabuyomi.app/Kabuyomi"
        BUNDLE_LOADER: "$(TEST_HOST)"
